[project]
name = "goad-toolkit"
version = "0.2.9"
description = "An extensible toolkit for Goal Oriented Analysis of Data"
readme = "README.md"
authors = [
    { name = "raoul grouls", email = "Raoul.Grouls@han.nl" }
]
requires-python = ">=3.12"
dependencies = [
    "loguru>=0.7.3",
    "matplotlib>=3.10.1",
    "numpy>=2.2.4",
    "pandas>=2.2.3",
    "pydantic>=2.10.6",
    "requests>=2.32.3",
    "scipy>=1.15.2",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.4",
    "tqdm>=4.67.1",
]
urls = {Github = "https://github.com/raoulg/goad_toolkit"}

[project.optional-dependencies]
parquet = ["pyarrow>=19.0.0"]

[project.scripts]
goad = "goad_toolkit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "isort>=6.0.1",
    "jupyter>=1.1.1",
    "pyarrow>=19.0.0",
    "pyright>=1.1.397",
    "pytest>=8.3.5",
    "ruff>=0.11.0",
]
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "N", "C4", "DTZ", "PT", "S"]

[tool.ruff.lint.per-file-ignores]
# assert is the assertion mechanism in tests and the demo script
"tests/**" = ["S101"]
"demo/**" = ["S101"]
